name: url-shortener

services:
  nginx:
    image: ghcr.io/shrimp332/swe40006-groupproject-nginx:latest
    container_name: url-shortener-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    command:
      - sh
      - -c
      - 'while :; do sleep 6h; nginx -s reload; done & exec nginx -g "daemon off;"'
    depends_on:
      - backend
      - grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot:latest
    container_name: url-shortener-certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint:
      - sh
      - -c
      - 'while :; do certbot renew --authenticator webroot --webroot-path /var/www/certbot --quiet; sleep 48h; done'

  backend:
    image: ghcr.io/shrimp332/swe40006-groupproject-backend:latest
    container_name: url-shortener-backend
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: url-shortener-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  glances:
    image: nicolargo/glances:latest-full
    container_name: url-shortener-glances
    restart: always
    pid: host
    environment:
      GLANCES_OPT: "--export prometheus --quiet"
    volumes:
      - ./glances/glances.conf:/etc/glances/glances.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: url-shortener-prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    depends_on:
      - glances

  grafana:
    image: grafana/grafana:latest
    container_name: url-shortener-grafana
    restart: always
    environment:
      GF_SERVER_DOMAIN: grafana.mylocalbus.com
      GF_SERVER_ROOT_URL: https://grafana.mylocalbus.com/
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
  grafanadata:
