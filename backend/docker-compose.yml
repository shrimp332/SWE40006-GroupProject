# Note:
# if you want to connect to swe40006-db via your preferred sql client like PgAdmin, Dbgate, etc, use the following login credentials:
# ---
# host: localhost
# post: 5436
# user: postgres
# password: localhost
# database: swe40006-db
# ---

services:
  app:
    container_name: swe40006-backend
    image: node:24-alpine
    working_dir: /usr/src/app
    env_file: .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "3002:3002"
    depends_on:
      - swe40006-db
    environment:
      DB_HOST: swe40006-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: swe40006-db

  swe40006-db:
    container_name: swe40006-db1
    image: postgres:16
    command: [
        "postgres",
        "-c",
        "log_connections=on",
        "-c",
        "log_destination=jsonlog",
        "-c",
        "logging_collector=on",
        "-c",
        "log_directory=log",
        "-c",
        "log_filename=log_postgresql-%Y-%m-%d_%H%M%S.log",
        "-c",
        "log_file_mode=0600",
        "-c",
        "log_rotation_age=1d",
        "-c",
        "log_min_messages=notice", # before: warning
        "-c",
        "log_min_error_statement=warning", # before: error
        "-c",
        "log_min_duration_statement=0", # before: 30ms
        "-c",
        "log_line_prefix=%m [%p] ",
        "-c",
        "log_statement=none",
        "-c",
        "log_timezone=UTC",
      ]
    platform: linux/amd64
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: swe40006-db
    ports:
      - "5436:5432"
    volumes:
      - pgdata1:/var/lib/postgresql/data

volumes:
  pgdata1:
